# Railway — конфигурация API-сервиса (apps/api).
# В UI: New Service → GitHub repo → Settings → Root Directory = apps/api.
# Variables сервиса:
#   DATABASE_URL = ${{ Postgres.DATABASE_URL }}   (ссылка на Postgres-плагин)
#   BOT_TOKEN, JWT_SECRET (≥32 симв.), ADMIN_TOKEN (≥32 симв.)
#   CORS_ORIGIN = https://${{ miniapp.RAILWAY_PUBLIC_DOMAIN }}   (домен фронта)
#   YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY, YOOKASSA_RETURN_URL   (когда будет касса)
#   SENTRY_DSN (опц.), NODE_ENV = production
# TRIBUTE_API_KEY больше не нужен (перешли на ЮKassa; роут deprecated).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway ждёт 200 на /health перед переключением трафика на новый деплой.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# startCommand не задаём: Dockerfile ENTRYPOINT сам делает
# `prisma migrate deploy` и запуск сервера.
